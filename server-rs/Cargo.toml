[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
bytes = "1.11.1"
chrono = "0.4.44"
dashmap = "6.1.0"
image = "0.25.10"
lazy_static = "1.5.0"
rand = "0.10.1"
regex = "1.12.3"
reqwest = "0.13.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socketioxide = { version = "0.18.3", features = ["state"] }
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
